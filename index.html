<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 coisas que quero te dizer 💗</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hearts"></div>

  <main class="container">

    <section id="intro" class="screen active">
      <div class="envelope">💌</div>

      <h1>Tenho algumas coisas para te dizer...</h1>

      <p>Preparei 10 cartões especialmente para você.</p>

      <button id="startBtn">
        Abrir os cartões ✨
      </button>
    </section>


    <section id="cardsScreen" class="screen">

      <div class="top">
        <span id="counter">1 / 10</span>

        <div class="progress">
          <div id="progressBar"></div>
        </div>
      </div>


      <article id="card" class="card">

        <div id="icon" class="icon">💌</div>

        <div id="title" class="card-title"></div>

        <p id="message"></p>

        <button id="nextBtn">
          Abrir 💗
        </button>

      </article>

    </section>


    <section id="finalScreen" class="screen">

      <div class="final-icon">🎁</div>

      <h1>Você achou que tinha acabado?</h1>

      <p class="final-message">
        Então guarda isso: você é alguém muito especial para mim.
        Obrigado por existir na minha vida e por ser exatamente quem você é. 💗
      </p>

      <button id="restartBtn">
        Ver tudo de novo 🔄
      </button>

    </section>

  </main>


  <!-- Música -->
  <audio id="music" loop controls>
  <source src="./musica.mp3" type="audio/mpeg">
  </audio>

<audio id="music" controls>
  <source src="./musica.mp3" type="audio/mpeg">
  Seu navegador não conseguiu carregar a música.
</audio>

<p id="musicStatus">🎵 Teste da música</p>

<script>
  const music = document.getElementById("music");

  music.addEventListener("error", () => {
    document.getElementById("musicStatus").textContent =
      "❌ Não consegui encontrar ou abrir musica.mp3";
  });

  music.addEventListener("canplay", () => {
    document.getElementById("musicStatus").textContent =
      "✅ Música encontrada!";
  });
</script>
  <script src="script.js"></script>

</body>
</html>
